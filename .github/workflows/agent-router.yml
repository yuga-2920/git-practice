name: agent-router

on:
  issues:
    types: [labeled]

permissions: {}

concurrency:
  group: agent-router-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  route:
    if: >-
      github.event.label.name == 'agent:ready' &&
      github.event.sender.login == 'yuga-2920' &&
      github.event.issue.user.login == 'yuga-2920'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
      - name: Route the issue
        run: node agent/src/router.ts
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          MAC_HEARTBEAT_AT: ${{ vars.MAC_HEARTBEAT_AT }}
